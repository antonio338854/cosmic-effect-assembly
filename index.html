<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito Cósmico - Assembly Visual</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: radial-gradient(ellipse at center, #1a0033 0%, #000 100%);
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ff;
            font-size: 12px;
            text-shadow: 0 0 10px #0ff;
            z-index: 10;
        }

        .title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 48px;
            text-shadow: 0 0 20px #0ff, 0 0 40px #f0f;
            font-weight: bold;
            z-index: 5;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="cosmicCanvas"></canvas>
    <div class="info">
        <div>Efeito Cósmico</div>
        <div>WebAssembly com Canvas API</div>
        <div id="fps">FPS: 0</div>
    </div>
    <div class="title">✦ COSMOS ✦</div>

    <script>
        // ============================================================
        // COSMIC EFFECT - Assembly Visual Simulation
        // ============================================================
        // Este código simula efeitos cósmicos usando Canvas API nativa
        // Inspirado em conceitos de programação Assembly de baixo nível

        class CosmicEffect {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;

                this.particles = [];
                this.planets = [];
                this.nebulas = [];
                this.time = 0;
                this.frameCount = 0;
                this.lastFpsTime = Date.now();

                this.initStars();
                this.initPlanets();
                this.initNebulas();
                this.setupResizeListener();
            }

            // Inicializa campo de estrelas
            initStars() {
                const starCount = 500;
                for (let i = 0; i < starCount; i++) {
                    this.particles.push({
                        x: Math.random() * this.width,
                        y: Math.random() * this.height,
                        z: Math.random() * 1000,
                        size: Math.random() * 2,
                        brightness: Math.random() * 0.5 + 0.5,
                        twinkleSpeed: Math.random() * 0.02 + 0.005,
                        twinklePhase: Math.random() * Math.PI * 2
                    });
                }
            }

            // Inicializa planetas orbitantes
            initPlanets() {
                this.planets = [
                    {
                        x: this.width / 2,
                        y: this.height / 2 - 100,
                        radius: 30,
                        color: '#ff6b6b',
                        orbitRadius: 100,
                        orbitSpeed: 0.001,
                        angle: 0
                    },
                    {
                        x: this.width / 2,
                        y: this.height / 2 - 150,
                        radius: 20,
                        color: '#4ecdc4',
                        orbitRadius: 150,
                        orbitSpeed: 0.0005,
                        angle: Math.PI
                    },
                    {
                        x: this.width / 2,
                        y: this.height / 2 + 80,
                        radius: 40,
                        color: '#ffe66d',
                        orbitRadius: 120,
                        orbitSpeed: 0.0008,
                        angle: Math.PI / 2
                    }
                ];
            }

            // Inicializa nebulosas
            initNebulas() {
                this.nebulas = [
                    {
                        x: this.width * 0.25,
                        y: this.height * 0.3,
                        radius: 80,
                        color: '#ff00ff',
                        opacity: 0.1
                    },
                    {
                        x: this.width * 0.75,
                        y: this.height * 0.7,
                        radius: 100,
                        color: '#00ffff',
                        opacity: 0.08
                    },
                    {
                        x: this.width * 0.5,
                        y: this.height * 0.5,
                        radius: 120,
                        color: '#ffffff',
                        opacity: 0.05
                    }
                ];
            }

            // Desenha nebulosa com gradiente
            drawNebula(nebula) {
                const gradient = this.ctx.createRadialGradient(
                    nebula.x, nebula.y, 0,
                    nebula.x, nebula.y, nebula.radius
                );
                gradient.addColorStop(0, nebula.color + Math.floor(nebula.opacity * 255).toString(16).padStart(2, '0'));
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(
                    nebula.x - nebula.radius,
                    nebula.y - nebula.radius,
                    nebula.radius * 2,
                    nebula.radius * 2
                );
            }

            // Desenha estrela com cintilação
            drawStar(particle) {
                const brightness = particle.brightness + 
                    Math.sin(this.time * particle.twinkleSpeed + particle.twinklePhase) * 0.3;

                this.ctx.fillStyle = `rgba(255, 255, 255, ${brightness})`;
                this.ctx.beginPath();
                this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                this.ctx.fill();
            }

            // Desenha planeta com brilho
            drawPlanet(planet) {
                // Sombra/halo
                this.ctx.fillStyle = `rgba(${parseInt(planet.color.slice(1, 3), 16)}, ${parseInt(planet.color.slice(3, 5), 16)}, ${parseInt(planet.color.slice(5, 7), 16)}, 0.3)`;
                this.ctx.beginPath();
                this.ctx.arc(planet.x, planet.y, planet.radius * 1.5, 0, Math.PI * 2);
                this.ctx.fill();

                // Planeta
                this.ctx.fillStyle = planet.color;
                this.ctx.beginPath();
                this.ctx.arc(planet.x, planet.y, planet.radius, 0, Math.PI * 2);
                this.ctx.fill();

                // Brilho especular
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                this.ctx.beginPath();
                this.ctx.arc(planet.x - planet.radius / 3, planet.y - planet.radius / 3, planet.radius / 4, 0, Math.PI * 2);
                this.ctx.fill();
            }

            // Desenha órbita de referência
            drawOrbit(planet) {
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.arc(this.width / 2, this.height / 2, planet.orbitRadius, 0, Math.PI * 2);
                this.ctx.stroke();
            }

            // Atualiza posição do planeta
            updatePlanet(planet) {
                planet.angle += planet.orbitSpeed;
                planet.x = this.width / 2 + Math.cos(planet.angle) * planet.orbitRadius;
                planet.y = this.height / 2 + Math.sin(planet.angle) * planet.orbitRadius;
            }

            // Loop principal de renderização
            update() {
                // Limpar canvas com fade
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, this.width, this.height);

                this.time++;

                // Desenhar nebulosas (fundo)
                this.nebulas.forEach(nebula => this.drawNebula(nebula));

                // Desenhar órbitas e atualizar planetas
                this.planets.forEach(planet => {
                    this.drawOrbit(planet);
                    this.updatePlanet(planet);
                    this.drawPlanet(planet);
                });

                // Desenhar estrelas
                this.particles.forEach(particle => this.drawStar(particle));

                // Adicionar novo efeito de tração ocasionalmente
                if (this.time % 50 === 0) {
                    this.addTrail();
                }

                this.updateFPS();
                this.frameCount++;
            }

            // Adiciona trilha visual ocasional
            addTrail() {
                const planet = this.planets[Math.floor(Math.random() * this.planets.length)];
                this.ctx.strokeStyle = `rgba(${Math.random() * 255}, ${Math.random() * 255}, ${Math.random() * 255}, 0.3)`;
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.moveTo(this.width / 2, this.height / 2);
                this.ctx.lineTo(planet.x, planet.y);
                this.ctx.stroke();
            }

            // Atualizar FPS display
            updateFPS() {
                const now = Date.now();
                if (now - this.lastFpsTime >= 1000) {
                    document.getElementById('fps').textContent = `FPS: ${this.frameCount}`;
                    this.frameCount = 0;
                    this.lastFpsTime = now;
                }
            }

            // Listener para redimensionamento
            setupResizeListener() {
                window.addEventListener('resize', () => {
                    this.width = window.innerWidth;
                    this.height = window.innerHeight;
                    this.canvas.width = this.width;
                    this.canvas.height = this.height;
                });
            }

            // Iniciar animação
            start() {
                const animate = () => {
                    this.update();
                    requestAnimationFrame(animate);
                };
                animate();
            }
        }

        // Inicializar efeito quando DOM estiver pronto
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('cosmicCanvas');
            const cosmic = new CosmicEffect(canvas);
            cosmic.start();
        });
    </script>
</body>
</html>
